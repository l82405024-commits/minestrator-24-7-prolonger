name: System Health Check

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Action Mode (e.g. SMART_KEEPALIVE, FORCE_RESTART, CONSOLE:op Player)'
        required: true
        default: 'SMART_KEEPALIVE'
        type: string
  repository_dispatch:
    types: [keepalive_ping, cron_job]

permissions:
  actions: write
  contents: read

jobs:
  health_check:
    name: System Routine Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Routine
        env:
          PYTHONUNBUFFERED: '1'
          SERVER_ID: '500883'
          MINESTRATOR_TOKEN: ${{ secrets.MINESTRATOR_TOKEN }}
          ACTION_MODE: ${{ github.event.inputs.action_mode || github.event.client_payload.action_mode || 'SMART_KEEPALIVE' }}
        run: python main.py


